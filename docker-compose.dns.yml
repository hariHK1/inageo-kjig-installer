# Overlay OPSIONAL — beri container app & harvester daftar DNS server
# LANGSUNG, bypass jalur relay DNS bawaan Docker (127.0.0.11 di dalam
# container -> stub systemd-resolved 127.0.0.53 di host -> resolver
# jaringan asli). Ditambahkan setelah ditemukan nyata di produksi
# (2026-08-10): resolusi DNS lewat jalur relay itu gagal 100% (EAI_AGAIN,
# baik untuk domain simpul jaringan maupun github.com), padahal query
# LANGSUNG ke resolver jaringan yang SAMA (dari host, tanpa lewat Docker)
# selalu sukses. Ini bug kategori yang sudah dikenal luas (relay Docker
# <-> systemd-resolved kadang tidak reliable), BUKAN resolver DNS
# jaringannya sendiri yang rusak.
#
# PILIHAN NILAI DNS_PRIMARY - BACA INI SEBELUM MENGISI, jawabannya beda
# per jaringan dan salah pilih membuat harvest gagal total dgn gejala yang
# menyesatkan.
#
# Bawaan yang MASUK AKAL: resolver internal jaringan kamu sendiri. Sejumlah
# domain instansi (big.go.id, ina-sdi.or.id, lihat ssrf-guard.ts di repo
# aplikasi) memang resolve ke IP privat lewat resolver internal pemerintah,
# dan DNS publik belum tentu punya jawaban yang sama.
#
# TAPI ITU HANYA BENAR KALAU RUTE PRIVATNYA MEMANG HIDUP. Terukur nyata di
# satu server produksi (2026-09-01): alamat di blok 10.10.x MENERIMA koneksi
# TCP lalu MEMBUANG ClientHello TLS. Akibatnya undici melapor
# "ConnectTimeoutError ... timeout: 10000ms" - fase connect miliknya mencakup
# handshake TLS - sehingga terbaca seolah host tujuan tidak bisa dihubungi,
# padahal `nc`/TCP polos ke port yang sama tersambung dalam 3ms. Uji TCP saja
# TIDAK cukup untuk memeriksa ini; handshake TLS-nya yang harus diuji.
#
# Pengukuran di server itu, host yang sama lewat dua resolver:
#   geoportal.big.go.id    internal 10.10.180.22  menggantung
#                          publik   202.4.179.105 TLS OK 17ms
#   geoservices.big.go.id  internal 10.10.180.77  menggantung
#                          publik   202.4.179.120 TLS OK 14ms
#   gresikkab.ina-sdi...   internal 10.10.180.53  menggantung
#                          publik   202.4.179.12  TLS OK 16ms
# Host yang TIDAK berada di blok 10.x (peta.big.go.id, ambon.ina-sdi.or.id)
# menjawab identik di kedua resolver. Tiga dari tiga host ber-IP privat gagal.
#
# CARA MEMUTUSKAN untuk jaringanmu sendiri: uji handshake TLS ke satu host
# simpul lewat resolver internal DAN publik. Kalau yang internal menggantung
# sementara yang publik berjabat tangan, isi DNS_PRIMARY dgn DNS PUBLIK -
# rute privatnya tidak berguna, dan mempertahankannya berarti setiap simpul
# di blok itu gagal permanen.
#
# Menukar DNS adalah TAMBALAN, bukan perbaikan: yang sebenarnya rusak adalah
# rute internal yang setengah hidup, dan itu ranah pengelola jaringan.
#
# DNS_FALLBACK murni jaring pengaman kalau primer benar-benar down (bukan
# cuma jalur relay-nya yang bermasalah).
#
# File ini HANYA dimasukkan ke COMPOSE_FILE oleh install.sh saat
# DNS_PRIMARY betul-betul diisi — kosong = perilaku default Docker
# (127.0.0.11) tetap dipakai, tidak mengubah deployment lain yang tidak
# mengalami masalah ini.
#
# `environment:` di bawah SELAIN `dns:` — ditambahkan setelah ditemukan
# nyata bahwa `dns:` saja TIDAK CUKUP: proxy DNS bawaan Docker (127.0.0.11)
# tetap jadi resolver DI DALAM container apa pun isi `dns:` (compose cuma
# atur upstream-nya, container tidak pernah benar-benar lepas dari proxy itu
# lewat config compose saja), dan proxy itu sendiri terbukti bisa kehilangan
# paket di bawah beban query DNS bersamaan tinggi (persis beban harvest).
# Kode aplikasi (src/app/apis/_lib/ssrf-guard.ts) baca DNS_PRIMARY/
# DNS_FALLBACK dari env ini utk query DNS LANGSUNG dari proses Node
# (dns.Resolver.setServers()), benar-benar melewati proxy 127.0.0.11.
services:
  app:
    dns:
      - ${DNS_PRIMARY}
      - ${DNS_FALLBACK:-1.1.1.1}
    environment:
      DNS_PRIMARY: ${DNS_PRIMARY}
      DNS_FALLBACK: ${DNS_FALLBACK:-1.1.1.1}
  harvester:
    dns:
      - ${DNS_PRIMARY}
      - ${DNS_FALLBACK:-1.1.1.1}
    environment:
      DNS_PRIMARY: ${DNS_PRIMARY}
      DNS_FALLBACK: ${DNS_FALLBACK:-1.1.1.1}
