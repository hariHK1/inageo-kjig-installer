# Overlay OPSIONAL — HANYA berisi `ports:` tambahan untuk akses langsung ke
# service infra yang biasanya internal-only (postgres/redis/redis-queue/
# harvester/mapproxy). TIDAK aktif secara default — docker-compose.yml
# sendirian sudah lengkap dan aman (semua service itu tetap internal-only).
# Port `app` (bypass nginx) SENGAJA di overlay terpisah, lihat
# docker-compose.app-port.yml.
#
# Diaktifkan HANYA kalau install.sh menulis baris ini ke .env:
#   COMPOSE_FILE=docker-compose.yml:docker-compose.ports.yml
# (var bawaan yang otomatis dibaca `docker compose`, tidak perlu -f manual.)
#
# Kenapa file terpisah, bukan `${VAR:-}` kosong langsung di docker-compose.yml
# utama: `ports: ["${POSTGRES_HOST_PORT}:5432"]` dengan var KOSONG menghasilkan
# ":5432" — syntax tidak valid / perilaku tidak konsisten antar versi Docker
# Compose. Memisah ke overlay opt-in inilah yang benar-benar membuat "kosong
# di .env = tidak ter-expose sama sekali", bukan sekadar port kosong.
#
# `networks:` di tiap service DITULIS ULANG LENGKAP (bukan cuma nambah
# `debug`) — SENGAJA, supaya benar tanpa bergantung ke perilaku merge-vs-
# replace Compose untuk field list (terverifikasi nyata di deployment: base
# docker-compose.yml menaruh service ini HANYA di network `cache`, yang
# `internal: true` — Docker tidak akan pernah benar-benar mem-publish host
# port untuk container yang jaringannya cuma network internal, walau
# `ports:` di-declare, `docker compose config` tetap menampilkannya seolah
# valid tapi `docker port`/`docker inspect` membuktikan binding-nya kosong).
# Network `debug` (non-internal, dideklarasikan di docker-compose.yml) HANYA
# menambah jalur publish-ke-host; komunikasi antar-container tetap lewat
# `cache` seperti biasa, tidak ada yang dilepas dari isolasi defaultnya.
services:
  postgres:
    networks:
      - cache
      - debug
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"

  redis:
    networks:
      - cache
      - debug
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"

  redis-queue:
    networks:
      - cache
      - debug
    ports:
      - "${REDIS_QUEUE_HOST_PORT:-6380}:6379"

  harvester:
    networks:
      - cache
      - debug
    ports:
      - "${HARVESTER_HOST_PORT:-4000}:4000"

  mapproxy:
    networks:
      - cache
      - debug
    ports:
      - "${MAPPROXY_HOST_PORT:-8081}:80"

  # Port app SENGAJA TIDAK di sini (lihat docker-compose.app-port.yml) — file
  # ini pakai fallback "${VAR:-default}" di semua service, artinya walau
  # APP_DIRECT_PORT dikosongkan (mis. karena APP_REPLICAS>1, install.sh
  # sengaja mengosongkannya), port app AKAN TETAP ter-publish ke default 3000
  # selama overlay ini aktif — itu persis bug yang pernah bikin 2 replica app
  # rebutan 1 port host & bikin nginx gagal start. Overlay app-port.yml
  # terpisah supaya cuma aktif kalau APP_DIRECT_PORT betul-betul diisi.
