# Stack operasional inageo-mapviewer — TANPA satu pun blok `build:`. Semua
# image di-pull dari GHCR, sudah dibangun & di-tag versi oleh GitHub Actions
# di repo source (inageo-mapviewer, lihat .github/workflows/release.yml di
# sana). Repo installer ini SENGAJA tidak menyimpan source code aplikasi.
services:
  app:
    image: ghcr.io/${GHCR_OWNER}/${GHCR_REPO}-app:${RELEASE_VERSION}
    restart: unless-stopped
    environment:
      API_ACCESS_TOKEN: ${API_ACCESS_TOKEN}
      # Default menunjuk ke service `minio` di stack ini (lihat definisinya di
      # bawah). Boleh di-override ke S3/MinIO eksternal lewat .env.
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-http://minio:9000}
      MINIO_REGION: ${MINIO_REGION:-us-east-1}
      # Isi SAMA dgn MINIO_ROOT_USER/MINIO_ROOT_PASSWORD kalau memakai service
      # `minio` bawaan stack — install.sh mengisinya otomatis utk instalasi
      # baru, deploy.sh (ensure_minio_credentials) melengkapinya otomatis utk
      # instalasi lama yang .env-nya belum punya var ini.
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      # Allowlist bucket yang boleh disajikan /apis/file (preview dokumen
      # harvest, key datang DARI KLIEN). Bucket thumbnail SENGAJA TIDAK
      # dimasukkan ke sini — ia dilayani endpoint sendiri yang tidak pernah
      # menerima key dari klien.
      ALLOWED_BUCKETS: ${ALLOWED_BUCKETS}
      THUMBNAIL_BUCKET: ${THUMBNAIL_BUCKET:-catalog-thumbnails}
      # Guard proxy /apis/[...path] & /apis/harvest/csw-records/[uuid] (POST/
      # DELETE) — lihat src/app/apis/_lib/admin-auth.ts di repo source.
      ADMIN_API_TOKEN: ${ADMIN_API_TOKEN}
      # Secret cookie sesi dashboard /admin/** — WAJIB, container gagal start
      # (throw) kalau kosong.
      DASHBOARD_SESSION_SECRET: ${DASHBOARD_SESSION_SECRET}
      # reCAPTCHA login /admin/login — opsional, dua-duanya kosong = mati.
      RECAPTCHA_SITE_KEY: ${RECAPTCHA_SITE_KEY}
      RECAPTCHA_SECRET_KEY: ${RECAPTCHA_SECRET_KEY}
      # Terjemahan otomatis ID->EN di CMS beranda (halaman admin "Manajemen
      # Beranda") — OPSIONAL, kosong = tombolnya disembunyikan & rute
      # terjemahan balas 501, sisa CMS tetap berfungsi penuh. Server-side
      # saja: key ini TIDAK PERNAH dikirim ke browser, hanya boolean
      # "aktif/tidak" yang diteruskan ke halaman lewat runtime config.
      # Mengaktifkan berarti teks yang diterjemahkan dikirim ke server DeepL
      # (pihak ketiga, luar negeri) — pertimbangkan kebijakan instansi.
      DEEPL_API_KEY: ${DEEPL_API_KEY:-}
      # Config publik — dibaca RUNTIME oleh image (src/lib/runtimeConfig.ts di
      # repo source), BUKAN di-bake saat build lagi. Ganti nilai di .env +
      # `docker compose up -d app` cukup, tidak perlu tag rilis baru sama
      # sekali. APP_ORIGIN murni server-side (cek CORS WMS); sisanya juga
      # dibaca browser lewat <script> yang disuntik layout.tsx.
      APP_ORIGIN: ${APP_ORIGIN}
      DATA_SOURCE: ${DATA_SOURCE:-sample}
      REACT_APP: ${REACT_APP:-production}
      RBI_URL: ${RBI_URL}
      GRAY_URL: ${GRAY_URL}
      GRAY_URL_ATTR: ${GRAY_URL_ATTR}
      SATELLITE_URL: ${SATELLITE_URL}
      SATELLITE_URL_ATTR: ${SATELLITE_URL_ATTR}
      TOPO_URL: ${TOPO_URL}
      TOPO_URL_ATTR: ${TOPO_URL_ATTR}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      MAPPROXY_SERVICE_URL: http://mapproxy/mapproxy/service
      MAPPROXY_MANIFEST_PATH: /app/mapproxy-config/layers-manifest.json
      # Alamat harvester. Default menunjuk service `harvester` di stack ini.
      # DIBUAT BISA DIATUR supaya app bisa diarahkan ke harvester yang
      # dikelola pihak lain (stack compose terpisah / host lain) tanpa
      # mengubah berkas ini — lihat menu "Deploy APP saja" di deploy.sh.
      # Kalau harvester itu container di stack lain pada server yang sama,
      # ia harus ikut bergabung ke salah satu network di bawah agar bisa
      # dipanggil lewat nama service; kalau di host lain, isi URL penuhnya.
      # API_ACCESS_TOKEN WAJIB sama dengan milik harvester tujuan.
      API_BACKEND: ${API_BACKEND:-http://harvester:4000}
      # true = harvester dikelola pihak lain (menu 20 deploy.sh mengisinya
      # otomatis, menu 2 mengembalikannya ke false). Dipakai halaman admin
      # Kesehatan Sistem & Skema Infrastruktur untuk menyatakan bahwa isinya
      # bersumber dari harvester itu — tanpa penanda ini, angka milik pihak
      # lain tampil seolah-olah kondisi server ini sendiri.
      HARVESTER_EXTERNAL: ${HARVESTER_EXTERNAL:-false}
      # Host GeoServer (batas wilayah + peta simpul jaringan /beranda) — sama
      # pola hardcode host non-secret dgn MAPPROXY_SERVICE_URL di atas, hanya
      # reachable lewat network "cache". Kredensial admin dipakai SERVER-SIDE
      # SAJA oleh rute upload SHP (halaman admin Manajemen Peta) — TIDAK
      # PERNAH dikirim ke browser. App tetap jalan normal kalau GeoServer
      # mati/belum di-deploy — TIDAK ditaruh di `depends_on` di bawah, sama
      # seperti mapproxy/minio, supaya downtime-nya tidak menjatuhkan app.
      #
      # KOSONG BY DEFAULT — GeoServer itu OPSIONAL (service-nya di-gate profil
      # "geoserver", lihat definisinya di bawah). Kosong = fitur dianggap
      # tidak dipasang: proxy balas 503 GEOSERVER_NOT_CONFIGURED, section
      # "Peta Simpul Jaringan" di /beranda otomatis SEMBUNYI, dan menu
      # "Manajemen Peta" di dashboard admin ikut disembunyikan. Utk
      # MENGAKTIFKAN, isi DUA-DUANYA di .env:
      #   COMPOSE_PROFILES=geoserver
      #   GEOSERVER_URL=http://geoserver:8080/geoserver
      GEOSERVER_URL: ${GEOSERVER_URL:-}
      GEOSERVER_ADMIN_USER: ${GEOSERVER_ADMIN_USER:-admin}
      # Default kosong supaya instalasi TANPA profil geoserver tidak dipaksa
      # mengisi variabel fitur yang tidak dipakainya. Saat profil AKTIF ini
      # tetap WAJIB diisi sungguhan (kosong = admin console GeoServer tanpa
      # password). Generate: openssl rand -base64 24
      GEOSERVER_ADMIN_PASSWORD: ${GEOSERVER_ADMIN_PASSWORD:-}
      # Fase 0 observability (opsional) — kosong = SDK Sentry no-op total,
      # app tetap jalan normal tanpanya. DSN didapat dari dashboard GlitchTip
      # (https://$DOMAIN:8443) setelah bikin akun+project di sana, BUKAN
      # dibuat otomatis compose ini.
      SENTRY_DSN: ${SENTRY_DSN:-}
    volumes:
      - ./mapproxy:/app/mapproxy-config:ro
    deploy:
      replicas: ${APP_REPLICAS:-2}
      # Batas resource (PER REPLIKA) — sinkron dgn repo source (inageo-mapviewer
      # docker-compose.yml, commit "Pasang batas resource di semua service"),
      # sebelumnya TIDAK ADA di installer ini sama sekali (drift, bukan
      # disengaja). `reservations` = jaminan minimum, tetap didapat walau host
      # lagi sibuk container lain.
      resources:
        limits:
          cpus: "${APP_CPU_LIMIT:-2}"
          memory: ${APP_MEMORY_LIMIT:-2G}
        reservations:
          cpus: "${APP_CPU_RESERVATION:-0.5}"
          memory: ${APP_MEMORY_RESERVATION:-512M}
    depends_on:
      # `harvester` SENGAJA TIDAK didaftarkan di sini. depends_on cuma
      # mengatur URUTAN start, bukan kesiapan — app memang tidak memerlukan
      # harvester saat boot (ia menembaknya belakangan, per-request). Kalau
      # didaftarkan, `docker compose up -d app` akan IKUT menyalakan
      # harvester, sehingga mode "app saja" mustahil dijalankan.
      - redis
    networks:
      - web
      - cache
    # Tanpa `ports:` di sini — publik hanya lewat nginx. Akses langsung
    # (bypass nginx) ada di docker-compose.ports.yml, opsional.

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M
    # Cuma 80 di base file — 443 SENGAJA dipindah ke overlay opsional
    # docker-compose.https-port.yml (install.sh menambahkannya otomatis
    # KECUALI BEHIND_WAF=true, di mana TLS ditangani WAF di depan & nginx di
    # sini cukup HTTP polos). Sebelumnya 443 SELALU ter-publish walau mode
    # WAF (nginx config WAF-nya sendiri tidak pernah listen 443 sama sekali)
    # — gap nyata, bukan disengaja.
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/snippets:/etc/nginx/snippets:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
      - nginx_cache:/var/cache/nginx
    command: >
      /bin/sh -c "/docker-entrypoint.sh nginx -g 'daemon off;' &
                  NGINX_PID=$$!;
                  (while :; do sleep 21600; nginx -s reload 2>/dev/null || true; done) &
                  wait $$NGINX_PID"
    depends_on:
      - app
    networks:
      - web

  certbot:
    image: certbot/certbot:v3.1.0
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: >
      /bin/sh -c "trap exit TERM; while :; do
                  certbot renew --webroot -w /var/www/certbot --quiet;
                  sleep 12h & wait $${!}; done"
    networks:
      - web

  # Config (mapproxy/mapproxy.yaml) TIDAK di-generate di sini — repo ini tidak
  # punya scripts/generate-mapproxy-config.mjs (butuh source app hidup). Sync
  # tetap dilakukan dari repo source, hasilnya disalin manual ke mapproxy/
  # server ini. Lihat README.md bagian "Gap: sinkronisasi MapProxy".
  mapproxy:
    image: ghcr.io/mapproxy/mapproxy/mapproxy:1.16.0-nginx
    restart: unless-stopped
    deploy:
      resources:
        limits:
          # 4 core — cocok dgn UWSGI_PROCESSES=4 di bawah (satu core per
          # proses), rendering tile bisa CPU-intensif.
          cpus: "4"
          memory: 2G
    environment:
      UWSGI_PROCESSES: 4
      UWSGI_THREADS: 8
    volumes:
      - ./mapproxy/mapproxy.yaml:/mapproxy/config/mapproxy.yaml:ro
      - mapproxy_cache:/mapproxy/config/cache_data
    networks:
      - cache

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    deploy:
      resources:
        limits:
          # Sedikit di atas REDIS_MAXMEMORY (data Redis sendiri) — sisa utk
          # overhead proses, BUKAN dobel dari REDIS_MAXMEMORY.
          cpus: "1"
          memory: 768M
    command: >
      redis-server --requirepass ${REDIS_PASSWORD}
                   --maxmemory ${REDIS_MAXMEMORY:-512mb}
                   --maxmemory-policy allkeys-lru
                   --save ""
                   --appendonly no
    networks:
      - cache

  postgres:
    image: postgis/postgis:16-3.4-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-harvester}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-harvester}
    # ── Total budget resource stack ini (semua limit di file ini, TIDAK
    # termasuk `elasticsearch` — server dedicated terpisah, lihat catatan di
    # sana): app(2×2C/2G) + nginx(1C/0.5G) + certbot(0.25C/0.125G) +
    # mapproxy(4C/2G) + redis(1C/0.75G) + postgres(4C/8G) +
    # postgres-backup(1C/0.5G) + redis-queue(1C/0.5G) + harvester(1×1C/1G) +
    # glitchtip-postgres(1C/0.5G) + glitchtip-valkey(0.5C/0.25G) +
    # glitchtip(1C/0.5G) + uptime-kuma(0.5C/0.25G) + minio(1C/0.5G) +
    # geoserver-db(1C/1G) + geoserver(1C/2G) ≈ 21 core / 22,375GB (minio
    # sebelumnya tidak ikut terhitung — ditambahkan sekarang) — sesuaikan
    # dgn kapasitas host produksi sesungguhnya sebelum menaikkan
    # APP_REPLICAS/HARVESTER_REPLICAS jauh lebih tinggi dari default.
    deploy:
      resources:
        limits:
          cpus: "4"
          memory: 8G
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - cache

  # Backup otomatis Postgres — SEBELUMNYA "di luar cakupan installer ini"
  # (lihat riwayat .env.example), sekarang diporting dari repo source supaya
  # installer benar-benar setara (parity), bukan cuma "cukup jalan". pg_dump
  # harian format custom (-F c, bisa direstore parsial via pg_restore) +
  # retensi otomatis — bukan solusi PITR/replika baca sungguhan, tapi jauh
  # lebih baik daripada nol jaring pengaman thd state persisten pertama di
  # stack ini (postgres_data, lihat catatan di service `postgres`).
  postgres-backup:
    image: postgis/postgis:16-3.4-alpine
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER:-harvester}
      POSTGRES_DB: ${POSTGRES_DB:-harvester}
      BACKUP_INTERVAL_SECONDS: ${POSTGRES_BACKUP_INTERVAL_SECONDS:-86400}
      BACKUP_RETENTION_DAYS: ${POSTGRES_BACKUP_RETENTION_DAYS:-14}
    entrypoint: >
      /bin/sh -c '
      trap exit TERM;
      while :; do
        ts=$$(date +%Y%m%d-%H%M%S);
        echo "[postgres-backup] mulai dump $$ts";
        if pg_dump -h postgres -U "$$POSTGRES_USER" -d "$$POSTGRES_DB" -F c -f "/backups/harvester-$$ts.dump"; then
          echo "[postgres-backup] sukses: harvester-$$ts.dump";
        else
          echo "[postgres-backup] GAGAL dump $$ts" >&2;
        fi;
        find /backups -name "harvester-*.dump" -mtime "+$$BACKUP_RETENTION_DAYS" -delete;
        sleep "$$BACKUP_INTERVAL_SECONDS" & wait $$!;
      done'
    volumes:
      - postgres_backups:/backups
    depends_on:
      - postgres
    networks:
      - cache
    # Tanpa `ports:` — sama isolasi dgn postgres sendiri. Restore manual:
    # `docker compose exec postgres-backup pg_restore -h postgres -U
    # $POSTGRES_USER -d $POSTGRES_DB --clean /backups/<file>.dump`.

  redis-queue:
    image: redis:7-alpine
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M
    command: >
      redis-server --requirepass ${REDIS_QUEUE_PASSWORD}
                   --maxmemory ${REDIS_QUEUE_MAXMEMORY:-256mb}
                   --maxmemory-policy noeviction
                   --appendonly yes
    volumes:
      - redis_queue_data:/data
    networks:
      - cache

  # Satu-satunya yang mount docker.sock ASLI — read-only, scope dibatasi
  # ketat (cuma daftar+stats container, TANPA exec/start/stop/network-modify/
  # image/volume/dst). harvester bicara ke SINI (via DOCKER_PROXY_URL),
  # TIDAK PERNAH ke docker.sock langsung — dasar Skema Teknologi/Kesehatan
  # Sistem live (lihat composeParser.ts & containerHealthSampler.ts di repo
  # source). Verifikasi ulang nama flag env ini terhadap README image versi
  # yang benar-benar dipakai kalau upgrade image — API proxy bisa berubah
  # antar versi mayor.
  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:v0.5.0
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
    environment:
      CONTAINERS: 1
      POST: 0
      IMAGES: 0
      INFO: 0
      NETWORKS: 0
      VOLUMES: 0
      EXEC: 0
      SERVICES: 0
      SWARM: 0
      SYSTEM: 0
      TASKS: 0
      BUILD: 0
      COMMIT: 0
      CONFIGS: 0
      DISTRIBUTION: 0
      PLUGINS: 0
      SECRETS: 0
      ALLOW_START: 0
      ALLOW_STOP: 0
      ALLOW_RESTARTS: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    # TANPA `ports:` sama sekali (otomatis tidak bisa ter-publish ke host,
    # gotcha yang sama didokumentasikan di docker-compose.ports.yml) + network
    # KHUSUS `docker-proxy-net` (bukan `cache`) - README resmi image ini minta
    # network SEMPIT cuma proxy+konsumen, bukan network luas yang dipakai
    # banyak service lain. internal:true - tidak ada rute ke internet sama
    # sekali, dari zona mana pun.
    networks:
      - docker-proxy-net

  harvester:
    image: ghcr.io/${GHCR_OWNER}/${GHCR_REPO}-harvester:${RELEASE_VERSION}
    restart: unless-stopped
    deploy:
      replicas: ${HARVESTER_REPLICAS:-1}
      # Batas PER REPLIKA — lihat catatan sama di service `app`, sinkron dgn
      # repo source. Nilai default konservatif (titik awal, bukan hasil
      # pengukuran) — naikkan berdasar `docker stats` nyata, bukan tebakan.
      resources:
        limits:
          cpus: "${HARVESTER_CPU_LIMIT:-1}"
          memory: ${HARVESTER_MEMORY_LIMIT:-1G}
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-harvester}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-harvester}
      REDIS_QUEUE_URL: redis://:${REDIS_QUEUE_PASSWORD}@redis-queue:6379
      API_ACCESS_TOKEN: ${API_ACCESS_TOKEN}
      SCAN_INTERVAL_MS: ${HARVEST_SCAN_INTERVAL_MS:-3600000}
      # Fitur "Cari Data" (katalog + isi-data) — cuma harvester yang bicara ke
      # ES, sama seperti Postgres/Redis-queue; app tidak pernah konek langsung
      # ke sini, semua lewat HTTP API harvester (lihat GET /search/* di source).
      ELASTICSEARCH_URL: http://elastic:${ELASTIC_PASSWORD}@elasticsearch:9200
      MAX_FEATURES_PER_LAYER: ${MAX_FEATURES_PER_LAYER:-50000}
      # Sama seperti SENTRY_DSN di service `app` — opsional, harvester tetap
      # jalan normal tanpanya. Var TERPISAH supaya error harvester & app bisa
      # dipisah jadi 2 project GlitchTip beda kalau mau triase lebih jelas.
      HARVESTER_SENTRY_DSN: ${HARVESTER_SENTRY_DSN:-}
      # Skema Teknologi/Kesehatan Sistem dinamis (lihat composeParser.ts &
      # containerHealthSampler.ts) — SEMUA opsional dari sisi kode (no-op
      # kalau kosong), tapi TIDAK kosong di sini krn bind-mount di bawah
      # SELALU disiapkan deploy.sh. Path internal TETAP (bukan dari .env) —
      # cuma titik mount container ini, bukan sesuatu yang perlu operator atur.
      COMPOSE_DIR: /compose
      COMPOSE_FILE_LIST: ${COMPOSE_FILE:-}
      COMPOSE_ENV_PATH: /compose/.env
      DOCKER_PROXY_URL: http://docker-socket-proxy:2375
      # Diisi MANUAL pasca-deploy (lihat README.md § post-deploy) — token/API
      # key baru ADA setelah GlitchTip/Uptime Kuma pertama kali dikonfigurasi
      # lewat UI native masing-masing, tidak bisa diisi wizard install.sh.
      GLITCHTIP_INTERNAL_URL: http://glitchtip:8000
      GLITCHTIP_API_TOKEN: ${GLITCHTIP_API_TOKEN:-}
      GLITCHTIP_ORG_SLUG: ${GLITCHTIP_ORG_SLUG:-}
      UPTIME_KUMA_METRICS_URL: http://uptime-kuma:3001/metrics
      UPTIME_KUMA_METRICS_USERNAME: ${UPTIME_KUMA_METRICS_USERNAME:-}
      UPTIME_KUMA_METRICS_PASSWORD: ${UPTIME_KUMA_METRICS_PASSWORD:-}
    volumes:
      # Read-only, docker-compose.yml BUKAN secret (isinya cuma ${VAR}
      # placeholder) — aman di-mount penuh. .env ASLI (berisi
      # DASHBOARD_SESSION_SECRET dkk, secret app Next.js) SENGAJA TIDAK
      # di-mount ke sini — .env.infra-display (dibuat deploy.sh
      # ensure_infra_display_env, allowlist var non-secret) yang dipasang
      # sbg /compose/.env. Semua file overlay di-mount TERLEPAS aktif/tidak
      # di COMPOSE_FILE (murah, bukan secret) — supaya composeParser.ts bisa
      # baca file mana pun yang namanya muncul di COMPOSE_FILE_LIST.
      - ./docker-compose.yml:/compose/docker-compose.yml:ro
      - ./docker-compose.ports.yml:/compose/docker-compose.ports.yml:ro
      - ./docker-compose.app-port.yml:/compose/docker-compose.app-port.yml:ro
      - ./docker-compose.harvester-port.yml:/compose/docker-compose.harvester-port.yml:ro
      - ./docker-compose.dns.yml:/compose/docker-compose.dns.yml:ro
      - ./docker-compose.https-port.yml:/compose/docker-compose.https-port.yml:ro
      - ./.env.infra-display:/compose/.env:ro
    depends_on:
      - postgres
      - redis-queue
      - elasticsearch
      - docker-socket-proxy
    # "web" WAJIB ADA DI SINI — network "cache" & "docker-proxy-net"
    # internal:true (tanpa rule NAT ke internet), sementara satu-satunya
    # tugas harvester justru fetch CSW/WMS dari server SIMPUL DI INTERNET.
    # Tanpa "web", harvester TIDAK PERNAH punya rute keluar sama sekali —
    # ditemukan sbg root cause nyata kegagalan EAI_AGAIN/ECONNREFUSED yang
    # dikira soal DNS relay Docker (fix retry+custom-resolver sebelumnya
    # cuma menambal gejala, bukan akar masalah: custom resolver pun tidak
    # bisa reach DNS manapun kalau network-nya sendiri tidak punya rute
    # keluar). Bug ini SUDAH ADA sejak scaffold awal repo (bukan regresi
    # docker-socket-proxy sesi observability dashboard), diverifikasi lewat
    # iptables NAT table produksi (tidak ada MASQUERADE utk subnet cache
    # maupun docker-proxy-net, cuma utk subnet web).
    networks:
      - web
      - cache
      - docker-proxy-net

  # Mesin pencari fitur "Cari Data" (katalog + isi-data lintas simpul) — server
  # dedicated resource tinggi (64GB RAM/32-core/512GB) disiapkan khusus untuk
  # ini. Single-node (satu server fisik), TANPA `ports:` (internal-only, sama
  # seperti postgres/redis/mapproxy — lihat catatan network `cache` di bawah).
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
    restart: unless-stopped
    deploy:
      resources:
        limits:
          # Beda alasan dari batas resource service lain di file ini — mereka
          # dibatasi supaya tidak "berebutan" host BERSAMA service lain (lihat
          # catatan app/harvester); ES di sini jalan di SERVER SENDIRI (lihat
          # komentar di atas), jadi tidak ada tetangga yang perlu dilindungi.
          # Angka ini murni jaring pengaman batas atas (heap JVM 16GB + ruang
          # off-heap Lucene secukupnya) — SESUAIKAN naik kalau server dedicated
          # ini memang disiapkan lebih besar dari 64GB/32-core yang diasumsikan
          # di komentar atas, jangan biarkan default ini jadi pembatas semu.
          cpus: "${ELASTICSEARCH_CPU_LIMIT:-16}"
          memory: ${ELASTICSEARCH_MEMORY_LIMIT:-32G}
    environment:
      discovery.type: single-node
      xpack.security.enabled: "true"
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD}
      # Batas heap JVM yang disarankan resmi Elasticsearch ~30-32GB (limit
      # compressed-OOPs pointer) SEKALIPUN RAM fisik jauh lebih besar — sisa
      # RAM SENGAJA dibiarkan kosong untuk OS page cache, yang justru krusial
      # buat performa baca Lucene (bukan pemborosan). Mulai konservatif di
      # 16GB dari 64GB tersedia, naikkan belakangan kalau index membesar &
      # perlu lebih (tidak pernah lewat ~30-32GB kapan pun).
      ES_JAVA_OPTS: -Xms16g -Xmx16g
    volumes:
      - es_data:/usr/share/elasticsearch/data
    networks:
      - cache

  # ── Fase 0 observability — diporting dari repo source, sebelumnya TIDAK
  # ADA di installer ini sama sekali. GlitchTip: error-tracking self-hosted
  # (MIT, kompatibel penuh SDK Sentry resmi @sentry/nextjs & @sentry/node).
  # Postgres & Valkey (fork Redis) instance TERPISAH dari yang dipakai
  # harvester/app — isolasi blast radius, sama filosofi redis vs redis-queue.
  glitchtip-postgres:
    image: postgres:18
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M
    environment:
      POSTGRES_USER: glitchtip
      POSTGRES_PASSWORD: ${GLITCHTIP_DB_PASSWORD}
      POSTGRES_DB: glitchtip
    # Mount di /var/lib/postgresql (BUKAN /var/lib/postgresql/data lagi) —
    # image resmi postgres MULAI MAYOR 18 pindah konvensi, data disimpan di
    # subdirektori ber-nama-versi (mendukung pg_ctlcluster-style multi-versi)
    # supaya "pg_upgrade --link" tidak terbentur batas mount point. Mount ke
    # path lama TETAP "berhasil" start container tapi entrypoint menolak
    # jalan (loop restart, pesan "there appears to be PostgreSQL data in
    # /var/lib/postgresql/data (unused mount/volume)") — terverifikasi nyata
    # di deployment. Referensi: docker-library/postgres#1259.
    volumes:
      - glitchtip_postgres_data:/var/lib/postgresql
    networks:
      - cache

  glitchtip-valkey:
    image: valkey/valkey:9
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    command: valkey-server --requirepass ${GLITCHTIP_VALKEY_PASSWORD} --save "" --appendonly no
    networks:
      - cache

  glitchtip:
    image: glitchtip/glitchtip:6
    restart: unless-stopped
    deploy:
      resources:
        limits:
          # Cocok dgn dokumentasi resmi (~256-512MB utk skala ops internal,
          # mode all_in_one: web+worker+beat satu proses).
          cpus: "1"
          memory: 512M
    environment:
      DATABASE_URL: postgres://glitchtip:${GLITCHTIP_DB_PASSWORD}@glitchtip-postgres:5432/glitchtip
      VALKEY_URL: redis://:${GLITCHTIP_VALKEY_PASSWORD}@glitchtip-valkey:6379
      SECRET_KEY: ${GLITCHTIP_SECRET_KEY}
      # Dashboard native GlitchTip TIDAK LAGI diekspos lewat nginx (sebelumnya
      # :8443, sudah dihapus, lihat nginx/conf.d & README.md). Ringkasan
      # error tetap bisa dilihat via /admin/kesehatan-sistem (repo source).
      GLITCHTIP_DOMAIN: https://${DOMAIN}
      DEFAULT_FROM_EMAIL: ${GLITCHTIP_FROM_EMAIL:-glitchtip@localhost}
      # consolemail:// = email cuma ditulis ke log container, tidak benar-
      # benar terkirim (default aman, dashboard tetap berfungsi tanpa SMTP).
      EMAIL_URL: ${GLITCHTIP_EMAIL_URL:-consolemail://}
      SERVER_ROLE: all_in_one
    depends_on:
      - glitchtip-postgres
      - glitchtip-valkey
    volumes:
      - glitchtip_uploads:/code/uploads
    # Cuma "cache" - dijangkau app/harvester kirim event error (DSN internal)
    # DAN harvester baca ringkasan lewat REST API (GLITCHTIP_API_TOKEN).
    # TIDAK LAGI di network "web" - dashboard native-nya sudah tidak
    # diekspos nginx sama sekali.
    networks:
      - cache

  uptime-kuma:
    image: louislam/uptime-kuma:1
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    volumes:
      - uptime_kuma_data:/app/data
    networks:
      - web
      - cache
    # "web" DIPERTAHANKAN (BUKAN cuma sisa dari sebelumnya) - bukan lagi utk
    # dijangkau nginx (dashboard native tidak diekspos lagi), TAPI Uptime
    # Kuma sendiri butuh rute internet KELUAR (`web` non-internal punya NAT
    # outbound via host, `cache` internal:true tidak) supaya monitor yang
    # dikonfigurasi memantau URL PUBLIK (opsional, disetel manual lewat
    # UI-nya) tetap bisa jalan - mencabutnya akan mematahkan fitur itu tanpa
    # manfaat keamanan tambahan (exposure sebenarnya sudah ditutup total
    # lewat nginx, bukan lewat keanggotaan network). "cache" - supaya bisa
    # cek langsung http://harvester:4000/health, postgres:5432, redis-
    # queue:6379, dll, DAN harvester baca /metrics-nya
    # (UPTIME_KUMA_METRICS_PASSWORD, lihat README.md § post-deploy).
    # CATATAN: karena jalan di server yang sama dgn yang dipantau, ini TIDAK
    # bisa mendeteksi "server ini mati total" — cuma failure level app/
    # service selama host masih hidup.

  # One-shot: seed awal simpul_jaringan dari sample-csw.json yang SUDAH
  # dibake ke image harvester (bukan lagi bind-mount dari host — repo ini
  # tidak punya file itu). `docker compose run --rm harvester-seed`.
  harvester-seed:
    image: ghcr.io/${GHCR_OWNER}/${GHCR_REPO}-harvester:${RELEASE_VERSION}
    profiles: ["tools"]
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-harvester}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-harvester}
      REDIS_QUEUE_URL: redis://:${REDIS_QUEUE_PASSWORD}@redis-queue:6379
      API_ACCESS_TOKEN: ${API_ACCESS_TOKEN}
      SAMPLE_CSW_PATH: /app/public/sample-csw.json
    command: node dist/scripts/seed-from-sample.js
    depends_on:
      - postgres
    networks:
      - cache

  # Object storage S3-compatible. DUA pemakai:
  #   1. Cache thumbnail katalog (alasan utama service ini dibuat) — thumbnail
  #      dirender SEKALI lalu disimpan permanen. Tanpa ini, layer berat (mis.
  #      batas desa se-Indonesia) dirender ULANG di server instansi tiap kali
  #      cache Redis 1 jam habis, untuk tiap pengunjung baru — lambat &
  #      berisiko membebani/diblokir server sumber (preseden nyata: WAF
  #      Sumatera Barat).
  #   2. Preview dokumen harvest — fitur lama yang selama ini MATI karena
  #      MINIO_ENDPOINT tidak pernah diisi.
  # Tanpa `ports:` & hanya network "cache" (internal:true) — sama filosofi
  # isolasi postgres/redis, tidak pernah dijangkau dari luar. Konsol admin
  # (:9001) SENGAJA tidak diekspos; kelola lewat `docker compose exec`.
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - cache

  # One-shot: buat bucket thumbnail + pasang aturan kedaluwarsa otomatis.
  # BUKAN `profiles: ["tools"]` (beda dari harvester-seed yang sengaja manual)
  # — ini WAJIB jalan tiap `up -d`, karena bucket & lifecycle rule adalah
  # prasyarat endpoint thumbnail, bukan tindakan opsional operator. Semua
  # perintahnya idempoten, aman dijalankan berulang.
  #
  # Lifecycle rule INILAH satu-satunya mekanisme kedaluwarsa cache thumbnail —
  # SENGAJA tidak ada job cleanup di kode aplikasi. Perlu karena kunci cache
  # berbasis KONTEN (bbox live + layer + URL service): kalau instansi mengubah
  # ISI petanya tanpa mengubah metadata/bbox, kuncinya tidak berubah dan
  # thumbnail lama akan basi selamanya tanpa jaring pengaman umur ini.
  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    restart: on-failure
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      THUMBNAIL_BUCKET: ${THUMBNAIL_BUCKET:-catalog-thumbnails}
      THUMBNAIL_TTL_DAYS: ${THUMBNAIL_TTL_DAYS:-30}
    entrypoint: >
      /bin/sh -c '
        set -e;
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD";
        mc mb --ignore-existing "local/$$THUMBNAIL_BUCKET";
        mc ilm rule remove --all --force "local/$$THUMBNAIL_BUCKET" 2>/dev/null || true;
        mc ilm rule add --expire-days "$$THUMBNAIL_TTL_DAYS" "local/$$THUMBNAIL_BUCKET";
        echo "[minio-init] bucket $$THUMBNAIL_BUCKET siap, kedaluwarsa $$THUMBNAIL_TTL_DAYS hari";
      '
    networks:
      - cache

  # ── Peta batas wilayah (Provinsi/Kabupaten/Kota) untuk section "Peta Simpul
  # Jaringan" /beranda — diporting dari repo source, DUA service khusus
  # (bukan numpang di `postgres`/harvester) sama filosofi glitchtip-postgres:
  # isolasi budget koneksi & backup, dataset ini murni GEOMETRI STATIS
  # (bukan data operasional harvester).
  #
  # PENTING: warna status simpul (Terhubung/Gangguan) TIDAK PERNAH disimpan
  # di sini — GeoServer/PostGIS ini HANYA menyajikan batas wilayah polos.
  # Status live tetap dari simpul_jaringan (Postgres harvester), digabung di
  # BROWSER — supaya cache GWC di bawah boleh di-cache selama-lamanya tanpa
  # perlu tahu kapan status simpul berubah.
  geoserver-db:
    image: postgis/postgis:16-3.4-alpine
    restart: unless-stopped
    # OPSIONAL — service ini & `geoserver` di bawah HANYA jalan kalau profil
    # "geoserver" diaktifkan (COMPOSE_PROFILES=geoserver di .env). Tanpa itu
    # keduanya tidak pernah dibuat: instalasi yang tidak butuh peta batas
    # wilayah hemat ~3 core/3GB, dan fitur terkaitnya otomatis sembunyi di UI
    # (bukan tampil rusak). Lihat GEOSERVER_URL di service `app` di atas.
    profiles: ["geoserver"]
    environment:
      POSTGRES_USER: ${GEOSERVER_DB_USER:-geoserver}
      # `:-` supaya instalasi tanpa profil ini tidak dibanjiri warning
      # "variable is not set" (Compose menginterpolasi seluruh file, termasuk
      # service yang profilnya mati). Jaring pengamannya tetap utuh: image
      # Postgres sendiri MENOLAK start tanpa password.
      POSTGRES_PASSWORD: ${GEOSERVER_DB_PASSWORD:-}
      POSTGRES_DB: ${GEOSERVER_DB_NAME:-geoserver}
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1G
    volumes:
      - geoserver_db_data:/var/lib/postgresql/data
    networks:
      - cache

  geoserver:
    # Image kartoza sudah membundel GeoWebCache (GWC) — "geoserver cache" =
    # fitur bawaan GWC ini, blobstore-nya dikonfigurasi tipe MBTiles lewat
    # admin UI/REST GeoServer setelah container jalan, bukan lewat compose.
    image: kartoza/geoserver:2.25.2
    restart: unless-stopped
    # Opsional — lihat catatan profil di `geoserver-db` di atas.
    profiles: ["geoserver"]
    environment:
      GEOSERVER_ADMIN_USER: ${GEOSERVER_ADMIN_USER:-admin}
      GEOSERVER_ADMIN_PASSWORD: ${GEOSERVER_ADMIN_PASSWORD:-}
      # Bukan auto-config datastore — kredensial ini dipakai rute upload
      # admin (repo source: src/app/apis/admin-local/manajemen-peta/upload)
      # utk membuat/menghubungkan datastore PostGIS lewat REST API GeoServer
      # saat SHP pertama diunggah.
      GEOSERVER_DB_HOST: geoserver-db
      GEOSERVER_DB_PORT: "5432"
      GEOSERVER_DB_NAME: ${GEOSERVER_DB_NAME:-geoserver}
      GEOSERVER_DB_USER: ${GEOSERVER_DB_USER:-geoserver}
      GEOSERVER_DB_PASSWORD: ${GEOSERVER_DB_PASSWORD:-}
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 2G
    volumes:
      - geoserver_data:/opt/geoserver/data_dir
    depends_on:
      - geoserver-db
    networks:
      - cache
    # Tanpa `ports:` — SATU-SATUNYA jalur browser mencapai GeoServer adalah
    # apis/map/geoserver-proxy (repo source, host internal tetap dari env
    # GEOSERVER_URL), persis pola isolasi mapproxy.

volumes:
  nginx_cache:
  mapproxy_cache:
  postgres_data:
  postgres_backups:
  redis_queue_data:
  es_data:
  glitchtip_postgres_data:
  glitchtip_uploads:
  uptime_kuma_data:
  minio_data:
  geoserver_db_data:
  geoserver_data:

networks:
  web:
    driver: bridge
  cache:
    driver: bridge
    internal: true
  # Non-internal, TIDAK dipakai service mana pun di file ini secara default
  # (murni deklarasi, harmless kalau tidak ada container yang join). HANYA
  # dipakai docker-compose.ports.yml untuk service yang mau di-expose ke host
  # — Docker TIDAK BISA membuat NAT/port-forward host->container untuk
  # container yang jaringannya cuma `cache` (internal:true SENGAJA menutup
  # rute itu, itulah tujuan flag-nya). Tanpa network kedua ini, menambahkan
  # `ports:` saja di overlay TIDAK CUKUP — port yang "ter-declare" tetap
  # tidak pernah benar-benar published (`docker port` kosong, terverifikasi
  # nyata di deployment, bukan teori).
  debug:
    driver: bridge
  # Khusus docker-socket-proxy <-> harvester SAJA - README resmi image ini
  # eksplisit merekomendasikan "only to a Docker network where only reside
  # the proxy itself and the service that uses it", BUKAN network `cache`
  # yang dipakai banyak service lain (postgres/redis/elasticsearch/glitchtip
  # dst). internal:true - sama isolasi dgn `cache`, tanpa rute ke internet.
  docker-proxy-net:
    driver: bridge
    internal: true
