# Skema asli yang dilihat KLIEN, untuk diteruskan sebagai X-Forwarded-Proto.
#
# MASALAH YANG DIPERBAIKI. Snippet proxy sebelumnya memakai `$scheme`, yang
# bernilai `http` karena nginx di sini memang mendengar di port 80 — TLS
# diakhiri di WAF, bukan di sini. Padahal WAF sudah mengirim
# `X-Forwarded-Proto: https`, dan kita menimpanya dengan `http`. Aplikasi di
# belakangnya karena itu menerima informasi yang salah tentang bagaimana
# pengunjung benar-benar terhubung.
#
# Belum ada yang bergantung padanya saat ini (aplikasi tidak punya
# metadataBase/sitemap yang membangun URL absolut), jadi ini memperbaiki bug
# LATEN — begitu ada fitur yang menyusun URL absolut, ia akan menghasilkan
# `http://` pada situs yang sebenarnya HTTPS, dan penyebabnya akan sangat
# sulit ditebak dari gejalanya.
#
# KENAPA BERKAS TERPISAH DI conf.d, BUKAN DI DALAM SNIPPET. `map` hanya sah di
# konteks http, sementara snippet proxy di-include di dalam `location`.
# Menaruhnya di template default.conf juga tidak cukup: berkas itu hanya
# DIHASILKAN sekali dan tidak ditulis ulang pada instalasi yang sudah berjalan
# (lihat cap APP_BASE_PATH di ensure_nginx_conf) — sehingga snippet baru akan
# merujuk variabel yang tidak pernah didefinisikan, dan nginx GAGAL START.
#
# nginx meng-include conf.d/*.conf berurutan menurut nama; awalan `00-`
# memastikan map ini terbaca sebelum default.conf memakainya.
#
# Nilai dari klien TIDAK dipercaya mentah-mentah: hanya `http` atau `https`
# yang diterima. Selain itu (kosong, ganda, atau isian sembarang dari klien
# yang menembak origin langsung) jatuh ke `$scheme` seperti perilaku lama.
map $http_x_forwarded_proto $skema_klien {
    default        $scheme;
    "http"         http;
    "https"        https;
}
