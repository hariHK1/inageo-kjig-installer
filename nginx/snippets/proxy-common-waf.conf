# Varian proxy-common.conf untuk mode "di belakang WAF" (default-waf.conf.example)
# — sama persis, KECUALI tanpa Strict-Transport-Security. Origin ini melayani
# HTTP biasa (WAF yang pegang TLS publik ke klien); HSTS pada respons HTTP
# polos tidak berarti apa-apa bagi browser dan cuma bikin bingung — HSTS
# semestinya diatur di WAF/edge yang benar-benar terminasi TLS.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# geolocation=(self) — tombol "Lokasi saya sekarang" (LocateMeButton.tsx,
# ol/Geolocation) butuh ini, DIPERKETAT LAGI dari geolocation=() semula
# begitu fitur itu ditambahkan (lihat histori git repo source — sempat
# memblokir fitur ini sendiri sampai ketahuan lewat "Permissions policy
# violation" di console). camera/microphone TETAP dinonaktifkan total —
# masih tidak dipakai di mana pun di kode.
add_header Permissions-Policy "geolocation=(self), camera=(), microphone=()" always;
# Fase 3 keamanan — SAMA PERSIS dgn proxy-common.conf, lihat catatan lengkap
# di sana (wasm-unsafe-eval utk Cesium, img/connect-src longgar demi fitur
# "Tambah Data" server WMS/ArcGIS eksternal, frame-src reCAPTCHA, style-src
# DAN script-src unsafe-inline — yang terakhir WAJIB, tanpa itu seluruh
# aplikasi lumpuh krn Next.js menyuntik inline script utk streaming RSC;
# baca alasan & batasannya lengkap di proxy-common.conf). Duplikasi SENGAJA
# (bukan di-share lewat include terpisah) — dua file ini memang dijaga
# identik kecuali baris HSTS.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.google.com/recaptcha/ https://www.gstatic.com/recaptcha/ 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; worker-src 'self'; img-src 'self' data: https:; connect-src 'self' https:; font-src 'self'; frame-src https://www.google.com/recaptcha/ https://recaptcha.net/recaptcha/; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self';" always;

proxy_http_version 1.1;
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header Upgrade           $http_upgrade;
proxy_set_header Connection        $connection_upgrade;
proxy_connect_timeout 3s;
proxy_send_timeout    60s;
proxy_read_timeout    60s;
proxy_next_upstream error timeout http_502 http_503 http_504;
proxy_next_upstream_tries 2;
