# Varian proxy-common.conf untuk mode "di belakang WAF" (default-waf.conf.example).
#
# HSTS: DULU sengaja DIHILANGKAN di sini dengan alasan "origin melayani HTTP
# polos, HSTS pada respons HTTP tidak berarti bagi browser, semestinya diatur
# di WAF". Alasan itu ternyata TIDAK TEPAT untuk topologi ini: yang menerima
# header ini bukan klien langsung dari origin, melainkan WAF — dan WAF
# meneruskannya ke browser lewat HTTPS. Diverifikasi nyata di produksi:
# X-Frame-Options/Referrer-Policy/Permissions-Policy dari file INI muncul utuh
# di respons HTTPS publik, jadi header dari origin memang diteruskan apa
# adanya. Tanpa baris di bawah, HSTS tidak pernah terkirim sama sekali dan
# terbaca sebagai temuan "HSTS Missing From HTTPS Server (RFC 6797)" di
# pemindaian keamanan.
#
# includeSubDomains disamakan dengan proxy-common.conf. Cakupannya hanya
# subdomain DARI host ini (mis. *.dev-kjig.big.go.id) — bukan big.go.id —
# tapi kalau suatu saat ada subdomain di bawahnya yang masih HTTP-only,
# subdomain itu akan ikut dipaksa HTTPS selama masa max-age.
# `preload` SENGAJA tidak dipakai (sama seperti proxy-common.conf): itu
# komitmen jangka panjang yang sulit ditarik kembali.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# geolocation=(self) — tombol "Lokasi saya sekarang" (LocateMeButton.tsx,
# ol/Geolocation) butuh ini, DIPERKETAT LAGI dari geolocation=() semula
# begitu fitur itu ditambahkan (lihat histori git repo source — sempat
# memblokir fitur ini sendiri sampai ketahuan lewat "Permissions policy
# violation" di console). camera/microphone TETAP dinonaktifkan total —
# masih tidak dipakai di mana pun di kode.
add_header Permissions-Policy "geolocation=(self), camera=(), microphone=()" always;
# Content-Security-Policy SENGAJA TIDAK diset di sini — SAMA PERSIS dgn
# proxy-common.conf, lihat catatan lengkap di sana. Sudah dipindah ke
# middleware Next.js (src/proxy.ts) supaya bisa memakai nonce per-request
# (bukan 'unsafe-inline'). JANGAN tambahkan add_header CSP di sini lagi —
# dua header CSP dari sumber berbeda diinterseksi browser, dan versi nginx
# tanpa nonce akan membatalkan nonce dari middleware.

proxy_http_version 1.1;
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
# $skema_klien, BUKAN $scheme — didefinisikan di conf.d/00-proto-map.conf.
# $scheme di sini SELALU 'http' (nginx mendengar di port 80; TLS diakhiri
# WAF), sehingga memakainya berarti menimpa 'https' yang sudah dikirim WAF
# dgn nilai yang salah. Map itu memakai X-Forwarded-Proto dari depan kalau
# isinya http/https, dan jatuh ke $scheme untuk nilai lain — termasuk saat
# tidak ada WAF sama sekali, sehingga perilaku lama tetap berlaku di sana.
proxy_set_header X-Forwarded-Proto $skema_klien;
proxy_set_header Upgrade           $http_upgrade;
proxy_set_header Connection        $connection_upgrade;
proxy_connect_timeout 3s;
proxy_send_timeout    60s;
proxy_read_timeout    60s;
proxy_next_upstream error timeout http_502 http_503 http_504;
proxy_next_upstream_tries 2;
