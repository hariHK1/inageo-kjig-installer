# Varian proxy-common.conf untuk mode "di belakang WAF" (default-waf.conf.example)
# — sama persis, KECUALI tanpa Strict-Transport-Security. Origin ini melayani
# HTTP biasa (WAF yang pegang TLS publik ke klien); HSTS pada respons HTTP
# polos tidak berarti apa-apa bagi browser dan cuma bikin bingung — HSTS
# semestinya diatur di WAF/edge yang benar-benar terminasi TLS.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# Dinonaktifkan semua — app ini tidak memakai geolocation/camera/microphone
# (sudah diverifikasi tidak ada pemanggilan navigator.geolocation/getUserMedia
# di manapun di kode). Perketat/perlonggar di sini kalau fitur itu ditambah nanti.
add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;

proxy_http_version 1.1;
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header Upgrade           $http_upgrade;
proxy_set_header Connection        $connection_upgrade;
proxy_connect_timeout 3s;
proxy_send_timeout    60s;
proxy_read_timeout    60s;
proxy_next_upstream error timeout http_502 http_503 http_504;
proxy_next_upstream_tries 2;
