# Catatan penting nginx: add_header TIDAK diwarisi ke location yang punya
# add_header sendiri (mis. /_next/static/ set X-Nginx-Cache) — inheritance-nya
# all-or-nothing, bukan digabung. Karena itu header keamanan ditaruh DI SINI
# (snippet yang di-include semua location), bukan di level server block —
# supaya konsisten terkirim di ketiga location tanpa terkecuali.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# geolocation=(self) — tombol "Lokasi saya sekarang" (LocateMeButton.tsx,
# ol/Geolocation) butuh ini, DIPERKETAT LAGI dari geolocation=() semula
# begitu fitur itu ditambahkan (lihat histori git repo source — sempat
# memblokir fitur ini sendiri sampai ketahuan lewat "Permissions policy
# violation" di console). camera/microphone TETAP dinonaktifkan total —
# masih tidak dipakai di mana pun di kode.
add_header Permissions-Policy "geolocation=(self), camera=(), microphone=()" always;
# Fase 3 keamanan — diaudit penuh (script/style/worker/img/connect/font/frame)
# thd seluruh kode src/ di repo source. Poin yang PERLU dijaga kalau CSP ini
# diedit lagi:
#  - 'wasm-unsafe-eval' WAJIB ada di script-src — Cesium (peta 3D) decode
#    terrain/Gaussian-splat via WebAssembly.instantiate, diblokir browser
#    tanpa ini walau file .wasm-nya sendiri same-origin.
#  - img-src/connect-src SENGAJA "https:" longgar (bukan whitelist domain
#    tertutup) — fitur "Tambah Data" mengizinkan admin menambah server WMS/
#    ArcGIS/SceneServer APA PUN; kalau server itu dukung CORS, browser
#    ambil tile LANGSUNG (bukan lewat proxy, demi performa) — whitelist
#    tertutup akan mematahkan fitur itu utk server yang belum terdaftar.
#  - frame-src WAJIB izinkan google.com/recaptcha & recaptcha.net —
#    reCAPTCHA me-render iframe saat runtime (tidak kelihatan dari grep
#    source code, gampang terlewat).
#  - style-src WAJIB 'unsafe-inline' — dipakai luas (style={{}} React +
#    OpenLayers/MapLibre/Cesium set canvas.style.* langsung saat runtime),
#    tidak realistis direfactor total ke nonce/hash.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://www.google.com/recaptcha/ https://www.gstatic.com/recaptcha/ 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; worker-src 'self'; img-src 'self' data: https:; connect-src 'self' https:; font-src 'self'; frame-src https://www.google.com/recaptcha/ https://recaptcha.net/recaptcha/; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self';" always;

proxy_http_version 1.1;
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header Upgrade           $http_upgrade;
proxy_set_header Connection        $connection_upgrade;
proxy_connect_timeout 3s;
proxy_send_timeout    60s;
proxy_read_timeout    60s;
# Replica app yang mati/masih booting: lempar ke alamat hasil resolusi berikutnya
# (resolver di conf utama membuat proxy_pass di atas resolve ulang tiap 10 detik).
proxy_next_upstream error timeout http_502 http_503 http_504;
proxy_next_upstream_tries 2;
