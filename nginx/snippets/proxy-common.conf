# Catatan penting nginx: add_header TIDAK diwarisi ke location yang punya
# add_header sendiri (mis. /_next/static/ set X-Nginx-Cache) — inheritance-nya
# all-or-nothing, bukan digabung. Karena itu header keamanan ditaruh DI SINI
# (snippet yang di-include semua location), bukan di level server block —
# supaya konsisten terkirim di ketiga location tanpa terkecuali.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# geolocation=(self) — tombol "Lokasi saya sekarang" (LocateMeButton.tsx,
# ol/Geolocation) butuh ini, DIPERKETAT LAGI dari geolocation=() semula
# begitu fitur itu ditambahkan (lihat histori git repo source — sempat
# memblokir fitur ini sendiri sampai ketahuan lewat "Permissions policy
# violation" di console). camera/microphone TETAP dinonaktifkan total —
# masih tidak dipakai di mana pun di kode.
add_header Permissions-Policy "geolocation=(self), camera=(), microphone=()" always;
# Content-Security-Policy SENGAJA TIDAK diset di sini (lagi) — dipindah ke
# middleware Next.js (repo source: src/proxy.ts). Alasannya: CSP yang aman
# WAJIB nonce per-request di script-src (bukan 'unsafe-inline', yang jadi
# temuan Medium hampir pasti di pemindaian VA), dan nonce itu harus dibuat
# per-request DAN diketahui Next.js — nginx tidak punya kanal memberi tahu
# nonce ke aplikasi, jadi CSP versi nginx terpaksa memakai 'unsafe-inline'.
#
# JANGAN tambahkan add_header Content-Security-Policy di sini lagi: browser
# MENGINTERSEKSI dua header CSP dari sumber berbeda (yang paling ketat
# menang per-directive) — CSP nginx tanpa nonce akan membatalkan nonce dari
# middleware, membuat SELURUH aplikasi blank lagi (pernah terjadi persis
# begini, lihat histori git repo installer).

proxy_http_version 1.1;
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
# $skema_klien, BUKAN $scheme — didefinisikan di conf.d/00-proto-map.conf.
# $scheme di sini SELALU 'http' (nginx mendengar di port 80; TLS diakhiri
# WAF), sehingga memakainya berarti menimpa 'https' yang sudah dikirim WAF
# dgn nilai yang salah. Map itu memakai X-Forwarded-Proto dari depan kalau
# isinya http/https, dan jatuh ke $scheme untuk nilai lain — termasuk saat
# tidak ada WAF sama sekali, sehingga perilaku lama tetap berlaku di sana.
proxy_set_header X-Forwarded-Proto $skema_klien;
proxy_set_header Upgrade           $http_upgrade;
proxy_set_header Connection        $connection_upgrade;
proxy_connect_timeout 3s;
proxy_send_timeout    60s;
proxy_read_timeout    60s;
# Replica app yang mati/masih booting: lempar ke alamat hasil resolusi berikutnya
# (resolver di conf utama membuat proxy_pass di atas resolve ulang tiap 10 detik).
proxy_next_upstream error timeout http_502 http_503 http_504;
proxy_next_upstream_tries 2;
